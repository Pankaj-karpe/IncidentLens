alertmanager:
  alertmanagerSpec:
    secrets: [incidentlens-webhook]        # mounted at /etc/alertmanager/secrets/incidentlens-webhook/
  config:
    route:
      receiver: incidentlens
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: incidentlens
        webhook_configs:
          - url: http://incidentlens-api.incidentlens-dev.svc.cluster.local:8000/alerts
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/incidentlens-webhook/token